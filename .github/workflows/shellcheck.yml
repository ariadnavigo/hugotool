name: shellcheck CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck -o all hugotool
